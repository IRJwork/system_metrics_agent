
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: system-metrics-api:1.0.0
    container_name: system-metrics-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: system-metrics-agent:1.0.0
    container_name: system-metrics-agent
    environment:
      METRICS_ENDPOINT: http://api:8000/metrics
      COLLECTION_INTERVAL: "5"
      REQUEST_TIMEOUT: "5"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
