name: CI/CD Pipeline - System Metrics

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements.lock

      - name: Check formatting
        run: black --check app

      - name: Check code quality
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --max-complexity=10 --max-line-length=88 --statistics

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements.lock

      - name: Run tests with coverage
        run: python -m pytest app/tests -v --cov=app --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-coverage
          path: .

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          pollingTimeoutSec: 300

  build-scan-push:
    name: Build, scan and publish Docker images
    runs-on: ubuntu-latest
    needs: [sonar]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t system-metrics-api:${{ github.sha }} .

      - name: Build agent image
        run: docker build -f Dockerfile.agent -t system-metrics-agent:${{ github.sha }} .

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          image-ref: system-metrics-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan agent image with Trivy
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          image-ref: system-metrics-agent:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag system-metrics-api:${{ github.sha }} "$DOCKERHUB_USERNAME/system-metrics-api:${{ github.sha }}"
          docker tag system-metrics-api:${{ github.sha }} "$DOCKERHUB_USERNAME/system-metrics-api:latest"
          docker push "$DOCKERHUB_USERNAME/system-metrics-api:${{ github.sha }}"
          docker push "$DOCKERHUB_USERNAME/system-metrics-api:latest"

      - name: Publish agent image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag system-metrics-agent:${{ github.sha }} "$DOCKERHUB_USERNAME/system-metrics-agent:${{ github.sha }}"
          docker tag system-metrics-agent:${{ github.sha }} "$DOCKERHUB_USERNAME/system-metrics-agent:latest"
          docker push "$DOCKERHUB_USERNAME/system-metrics-agent:${{ github.sha }}"
          docker push "$DOCKERHUB_USERNAME/system-metrics-agent:latest"